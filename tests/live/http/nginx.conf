# Static REST API fixture for the read_config `api` backend.
#
# ApiBackend models an API as an ordered list of GET endpoints, so a static
# file tree is a faithful stand-in for the real thing: nginx serves JSON,
# emits a real ETag per file (exercising the ETag fingerprint path), and
# returns 404 for absent layers (exercising the layer-absent path).
#
# Bearer-token auth is enforced so the auth_token/auth_header/auth_scheme
# sugar is covered against a server that actually rejects bad credentials.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    default_type application/json;

    # Unauthenticated, used only by the readiness probe.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Foreman-shaped tree, used by the `api: foreman` preset tests.
    location /api/ {
        if ($http_authorization != "Bearer rc-test-token") {
            return 401 '{"error":"unauthorized"}';
        }
        try_files $uri $uri/index.json =404;
    }

    location /v1/ {
        if ($http_authorization != "Bearer rc-test-token") {
            return 401 '{"error":"unauthorized"}';
        }
        # Directory-style paths map to an extensionless file on disk.
        try_files $uri $uri/index.json =404;
    }

    # Everything outside /v1/ is not part of the fixture surface.
    location / {
        return 404 '{"error":"not found"}';
    }
}
